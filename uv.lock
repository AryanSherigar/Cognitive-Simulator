version = 1
revision = 5
requires-python = ">=3.11"

[[package]]
name = "annotated-types"
version = "0.8.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "cognitive-simulator"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "pydantic" },
]

[package.optional-dependencies]
dev = [
    { name = "mypy" },
    { name = "pytest" },
    { name = "ruff" },
]
live = [
    { name = "llama-cpp-python" },
]

[[package]]
name = "llama-cpp-python"
version = "0.3.16"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "mypy"
version = "2.4.1"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pydantic"
version = "2.14.4"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "annotated-types" },
    { name = "pydantic-core" },
    { name = "typing-extensions" },
    { name = "typing-inspection" },
]

[[package]]
name = "pydantic-core"
version = "2.50.5"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "typing-extensions" },
]

[[package]]
name = "pytest"
version = "9.2.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "ruff"
version = "0.17.6"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "typing-extensions"
version = "4.16.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "typing-inspection"
version = "0.4.2"
source = { registry = "https://pypi.org/simple" }
